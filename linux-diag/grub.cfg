# GRUB config for the Cx3Mlx4 Linux diagnostic stick.
#
# Derived from Alpine's own boot/grub/grub.cfg; the only changes are the
# automation parameters and dropping `quiet` so the operator can see the boot
# progressing rather than staring at a blank screen.
#
# apkovl is deliberately NOT passed on the command line: nlplug-findfs scans the
# boot media for *.apkovl.tar.gz and init picks it up from there.  Passing a bare
# filename would not work, because init tests it with [ -f ] relative to /.

set timeout=5
set default=0

menuentry "Cx3Mlx4 Linux diagnostic (runs automatically)" {
	linux	/boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage console=tty0 iomem=relaxed module_blacklist=mlx4_core,mlx4_en,mlx4_ib modprobe.blacklist=mlx4_core,mlx4_en,mlx4_ib
	initrd	/boot/initramfs-lts
}

menuentry "Cx3Mlx4 Linux diagnostic (verbose boot)" {
	linux	/boot/vmlinuz-lts modules=loop,squashfs,sd-mod,usb-storage console=tty0 iomem=relaxed debug_init module_blacklist=mlx4_core,mlx4_en,mlx4_ib modprobe.blacklist=mlx4_core,mlx4_en,mlx4_ib
	initrd	/boot/initramfs-lts
}
